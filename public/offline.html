<!doctype html>
<html lang="ht">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F97316" />
    <title>Pa gen Entènèt — NK Deliveri</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #fff7ed;
        color: #1c1408;
        font-family:
          -apple-system, "Segoe UI", system-ui, Roboto, "Helvetica Neue", Arial, sans-serif;
        text-align: center;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #1c1408;
          color: #fff2e3;
        }
      }
      .card {
        max-width: 380px;
      }
      .logo {
        width: 64px;
        height: 64px;
        border-radius: 18px;
        background: #f97316;
        color: #fff;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        font-size: 22px;
        letter-spacing: -0.02em;
        margin-bottom: 20px;
      }
      h1 {
        font-size: 1.3rem;
        margin: 0 0 8px;
      }
      p {
        margin: 0 0 20px;
        line-height: 1.6;
        opacity: 0.85;
      }
      button {
        appearance: none;
        border: none;
        border-radius: 999px;
        background: #f97316;
        color: #fff;
        font-weight: 700;
        font-size: 0.95rem;
        padding: 12px 28px;
        cursor: pointer;
      }
      button:hover {
        background: #ea6a0e;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">NK</div>
      <h1>Ou pa konekte sou Entènèt</h1>
      <p>
        Nou pa ka chaje paj sa a kounye a. Verifye koneksyon Wi-Fi oswa done mobil ou, epi eseye
        ankò.
      </p>
      <button onclick="location.reload()">Eseye ankò</button>
    </div>
  </body>
</html>
