name: CI

# Runs on every PR into main (the merge gate — see docs/reference/DEVOPS.md for the
# exact branch protection settings this is meant to back) and again on
# every push to main (so a bad merge or a direct push is caught the same
# way, and the badge on main always reflects the real state of HEAD).
#
# This workflow does NOT deploy anything. NK Deliveri is deployed via
# Vercel's own native GitHub integration, which builds and deploys
# independently on every push (production on main, a preview per PR) using
# the exact same `npm run build` this workflow also runs — duplicating
# that here would just be two systems racing to deploy the same commit.
# This workflow's job is the quality gate Vercel's deploy doesn't provide:
# lint/typecheck/format/migration-safety, required to pass before a PR can
# merge.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, format, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # C-02 remediation (docs/archive/phases/PHASE0_C01_C02_REMEDIATION_REPORT.md) — the
      # 173-test unit suite existed but was never actually run by CI.
      # Reuses this job's existing `npm ci` — no new job, no new install.
      # Deliberately placed FIRST, ahead of lint/format/typecheck: found
      # during regression verification that `npm run format:check` (a
      # pre-existing step, unrelated to C-01/C-02) already fails on `main`
      # today because of 114 pre-existing files never Prettier-formatted
      # (docs/*.md, CLAUDE.md, README.md, CONTRIBUTING.md — confirmed on a
      # clean tracked-only tree, nothing this phase touched). Left at
      # step order it was, this new test step would never actually run —
      # the job stops at the first failing step. Fixing that 114-file
      # formatting debt is out of scope for a C-01/C-02-only phase (see
      # the remediation report's "flagged, not fixed" section); running
      # tests before the pre-existing-broken step is the smallest in-scope
      # change that keeps them from being silently skipped.
      - name: Unit tests (Vitest)
        run: npm run test

      - name: Lint (ESLint)
        run: npm run lint

      - name: Format check (Prettier)
        run: npm run format:check

      - name: Typecheck (tsc)
        run: npm run typecheck

      - name: Migration overload-hazard check
        run: npm run check:migrations

      - name: Production build
        run: npm run build

      - name: Summary
        if: always()
        run: |
          echo "### CI — quality gate" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Lint | ${{ job.status }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build target | Vercel (Nitro \`preset: vercel\`, pinned in vite.config.ts) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"

  migrations-db:
    name: Validate Supabase migrations (local replay)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # `supabase start` boots a full local stack (Postgres + Auth +
      # PostgREST + Realtime + Storage) via Docker. On a fresh volume it
      # ALSO auto-replays every file under supabase/migrations/, and for
      # each one it unconditionally runs its own
      # `INSERT INTO supabase_migrations.schema_migrations(...)` right
      # after the file's SQL finishes — no ON CONFLICT guard.
      #
      # A set of migrations ("Rule A11" — see audit/findings.jsonl OPS-004)
      # already perform that exact insert themselves, guarded by
      # `ON CONFLICT (version) DO NOTHING`. That convention exists for a
      # migration applied by hand via the SQL Editor, and Q-1
      # (audit/HANDOFF-SQL.md, 2026-08-28) confirmed the original 8 are
      # already applied to production that way — so their SQL content is
      # out of scope to edit here, and touching it would risk drift from
      # what actually ran. When the CLI instead replays these files itself
      # during `supabase start`, its own insert loses the race for the
      # same primary key and the step fails with "duplicate key value
      # violates unique constraint schema_migrations_pkey".
      #
      # THE PREVIOUS FIX MOVED THOSE FILES OUT of supabase/migrations/ for
      # the duration of the replay, and that is what this step now stops
      # doing. Moving a migration out does not just skip its bookkeeping
      # insert — it skips THE WHOLE FILE, including every table, type and
      # function it creates. The convention has since spread well past the
      # original 8 legacy files to 18, and the auto-detecting grep the old
      # comment praised as "no hardcoded version list to keep in sync" is
      # exactly what silently swept up the newer ones. Among them:
      #
      #   20260830110000_footer_partners.sql   <- CREATEs public.partners
      #
      # while 20260830180000_fix_has_role_gate_batch2.sql is NOT a Rule A11
      # file, stays, replays, and does `RETURNS SETOF public.partners`. The
      # job therefore failed on every run with:
      #
      #   ERROR: type "public.partners" does not exist (SQLSTATE 42704)
      #
      # Neutralise the statement, not the file. Each of the 18 files holds
      # exactly one such INSERT, spanning exactly three lines (verified
      # across all 18); the sed range comments out from the INSERT through
      # the first line ending in `;`, leaving the surrounding BEGIN/COMMIT
      # and every other statement untouched. Every migration then replays
      # in its real timestamp order, so dependencies between them hold, and
      # the CLI does the bookkeeping itself with no competing insert.
      #
      # Originals are restored from /tmp right after `supabase start`, so
      # any later step in this job sees the checkout exactly as committed.
      # Dropping the statement in CI loses nothing: it only ever existed to
      # record a hand-applied migration in production, and on this fresh
      # throwaway database the CLI writes that row anyway.
      - name: Apply every migration to a fresh local database
        run: |
          mkdir -p /tmp/rule-a11-backup
          rule_a11_files=$(grep -lE '^INSERT INTO supabase_migrations\.schema_migrations' supabase/migrations/*.sql || true)
          for f in $rule_a11_files; do
            echo "Neutralising Rule A11 bookkeeping insert in $(basename "$f")"
            cp "$f" "/tmp/rule-a11-backup/$(basename "$f")"
            sed -i '/^INSERT INTO supabase_migrations\.schema_migrations/,/;[[:space:]]*$/ s|^|-- [ci-replay] |' "$f"
          done
          supabase start
          for f in $rule_a11_files; do
            cp "/tmp/rule-a11-backup/$(basename "$f")" "$f"
          done

      # C-01 remediation (docs/archive/phases/PHASE0_C01_C02_REMEDIATION_REPORT.md) —
      # persisted regression proof that direct writes to public.user_roles
      # stay blocked for every role (the RLS bypass this migration fixed)
      # and that add_user_role_secure/remove_user_role_secure keep working
      # normally. Reuses the local stack this job already booted — no new
      # service, no new dependency (psql ships on the ubuntu-latest
      # runner), same DO $$ ... $$ / BEGIN-ROLLBACK idiom already used
      # throughout this project's migration testing, just persisted to a
      # file instead of run ad hoc.
      - name: C-01 security regression — user_roles RLS + step-up MFA
        run: |
          eval "$(supabase status -o env)"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/c01_user_roles_security.sql

      - name: Stop local stack
        if: always()
        run: supabase stop --no-backup

  # C-02 remediation (docs/archive/phases/PHASE0_C01_C02_REMEDIATION_REPORT.md) — the
  # 31-spec/77-test Playwright suite existed but was never run by CI.
  # Split into two jobs, not one, per this project's own documented
  # finding (docs/archive/audits/E2E_TEST_REPORT.md §5): running all 9 projects together
  # causes real, reproducible resource contention (several Chromium/WebKit
  # instances plus a Lighthouse audit competing for one machine) that
  # produces intermittent, non-deterministic failures unrelated to actual
  # regressions — not a suite defect, a documented side effect of the
  # local hardware that recommended exactly this split. Both jobs target
  # the fully-mocked E2E harness (e2e/mocks/*, `.env.e2e` — intentionally
  # tracked in git, see its own .gitignore comment) — no live Supabase
  # project, no secrets, by the same design decision documented in
  # docs/archive/audits/E2E_TEST_REPORT.md §1 (validated with the user before that work
  # began: never run E2E against the real backend).
  e2e-functional:
    name: E2E — client/restaurant/driver/admin/auth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Build (mock Supabase URL baked in via --mode e2e)
        run: npm run build:e2e

      - name: Run functional E2E projects
        run: npx playwright test --project=client --project=restaurant --project=driver --project=admin --project=auth

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-functional
          path: playwright-report/
          retention-days: 14

  e2e-cross-cutting:
    name: E2E — accessibility/Lighthouse/SEO/PWA/offline/responsive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Build (mock Supabase URL baked in via --mode e2e)
        run: npm run build:e2e

      - name: Run cross-cutting + responsive E2E projects
        run: npx playwright test --project=cross-cutting --project=responsive-mobile-chrome --project=responsive-mobile-safari --project=responsive-tablet --project=responsive-desktop

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-cross-cutting
          path: playwright-report/
          retention-days: 14
